services:
  db:
    image: postgis/postgis:16-3.4
    container_name: parche-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parche
      POSTGRES_PASSWORD: parche
      POSTGRES_DB: parche
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
